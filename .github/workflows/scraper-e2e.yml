name: Scraper end-to-end (mock shop)

# A böngészős scraper-ág teljes végigfuttatása egy self-hosted mock shop
# ellen. Nem érint külső oldalt: a generátor legyártja a termékoldalakat,
# egy statikus szerver kiszolgálja, a Playwright pedig végigscrape-eli.
#
# Az élő adat a Steam publikus API-jából jön (lásd scrape.yml) – ez a
# workflow azt igazolja, hogy a scraper-réteg maga működik.

on:
  push:
    paths:
      - "scraper/**"
      - "mock-shop/**"
      - ".github/workflows/scraper-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Függőségek
        run: pip install -r scraper/requirements.txt

      - name: Playwright verzió kiolvasása
        id: pw
        run: echo "version=$(pip show playwright | awk '/^Version:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Böngésző cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Chromium telepítése
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Mock shop generálása
        run: python mock-shop/generate.py

      - name: Mock shop kiszolgálása
        run: |
          python -m http.server 8000 --directory mock-shop/site &
          # Megvárjuk, hogy tényleg fogadjon kapcsolatot – a sima sleep flaky.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/robots.txt >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/robots.txt >/dev/null

      - name: Scraper végigfuttatása
        working-directory: scraper
        run: python scrape.py --catalog products.mock.json --dry-run --delay 0.2
