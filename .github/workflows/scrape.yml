name: Napi árfigyelés

on:
  schedule:
    # 06:12 UTC – nyáron 08:12, télen 07:12 budapesti idő szerint.
    # Nem kerek órára időzítve: akkor fut a legtöbb cron a GitHubon, és a
    # futások percekkel-tízpercekkel csúszhatnak.
    - cron: "12 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Csak az első N címet kérje le (üres = mind)"
        required: false
        type: string

permissions:
  contents: write # a lokális JSON fallback commit-backhez kell

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Hálózat nélküli tesztek. Néhány másodperc, és megfogja a saját
  # regressziónkat még azelőtt, hogy bárkinek kérést küldenénk.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feldolgozó logika tesztjei
        working-directory: scraper
        run: |
          python test_extract.py
          python test_steam.py

  # ---------------------------------------------------------------------------
  # Élő adat: a Steam publikus store API-ja.
  # ---------------------------------------------------------------------------
  snapshot:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      # A Steam-ág csak a standard könyvtárat használja; a supabase csomag
      # akkor kell, ha vannak Supabase secretek.
      - name: Függőségek
        run: pip install -r scraper/requirements-api.txt

      - name: Árpillanatkép lekérése
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fetch_steam.py ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # Ha nincs Supabase secret, a store lokális JSON-be írt – azt visszatoljuk
      # a repóba, ami egyben új Vercel deployt is kivált. Supabase módban ez a
      # lépés no-op, mert a fájl nem változik.
      - name: Adat visszacommitolása (lokális mód)
        run: |
          if git diff --quiet -- web/public/data/db.json; then
            echo "Nincs változás a lokális DB-ben – nincs mit commitolni."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/db.json
          git commit -m "chore(data): napi árpillanatkép $(date -u +%Y-%m-%d)"
          git push
